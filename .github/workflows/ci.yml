# =============================================================================
# CI — runs on every pull request and on every push to `main`.
# =============================================================================
# If any of these jobs fail, the PR cannot be merged.
#
# Jobs:
#   - lint           : SwiftLint catches bugs and anti-patterns.
#   - format-check   : SwiftFormat confirms every Swift file is formatted.
#   - prettier-check : Prettier confirms Markdown / JSON / YAML are formatted.
#   - test           : XCTest runs unit + UI tests in the iOS simulator.
#
# Runner: macos-latest (Apple Silicon, ships with current Xcode preinstalled).
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs when the same PR gets a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: 2.45.4
  SWIFTLINT_VERSION: 0.63.2
  SWIFTFORMAT_VERSION: 0.61.1
  XCBEAUTIFY_VERSION: 3.2.1

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - run: swiftlint lint --strict

  format-check:
    name: Format check (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftFormat
        run: brew install swiftformat
      - run: swiftformat --lint ios

  prettier-check:
    name: Format check (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin to an Xcode that ships the iOS 26 SDK (matches the project's
          # IPHONEOS_DEPLOYMENT_TARGET). `latest-stable` falls back to whatever
          # the runner image has if 26 isn't yet available.
          xcode-version: latest-stable
      - name: Show Xcode + Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Install tools
        run: brew install xcodegen xcbeautify
      # Most of the Tests job time is the SPM packages (Supabase, Sentry,
      # PostHog, Kingfisher, Crypto, …) being checked out and compiled. We
      # cache the source checkouts and the DerivedData build outputs keyed
      # on project.yml so a Dependabot version bump invalidates cleanly.
      # restore-keys gives partial hits on unrelated edits to project.yml.
      - name: Cache SPM + DerivedData
        uses: actions/cache@v5
        with:
          path: |
            build/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      # Write the repo-root .env from secrets so the build's "Generate Config
      # from .env" phase injects real Supabase credentials. Without these the
      # UI tests can't render loaded (data-backed) views, which tanks line
      # coverage. Only the two required keys; telemetry stays off in CI.
      #
      # NOTE: Dependabot-triggered runs do NOT see Actions secrets — they read
      # from the separate *Dependabot* secrets store. Both SUPABASE_URL and
      # SUPABASE_ANON_KEY are mirrored there so Dependabot PRs run the full
      # suite (it matters most for SPM bumps like supabase-swift). These are
      # the publishable anon key + project URL — already shipped in the app
      # binary — so mirroring them is not a secret-exposure concern. If you
      # ever rotate the Actions secrets, rotate the Dependabot ones too, or
      # Dependabot PRs will start failing with "Missing SUPABASE_URL":
      #   gh secret set SUPABASE_URL       --app dependabot < value
      #   gh secret set SUPABASE_ANON_KEY  --app dependabot < value
      - name: Write .env + generate config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          } > .env
          # The Xcode "Generate Config from .env" preBuild script writes this
          # same file, but xcconfig is resolved BEFORE preBuild scripts run —
          # so on a fresh CI checkout the first build would fall back to the
          # placeholder creds and the UI tests couldn't load data. Generate it
          # here, ahead of the build, mirroring that script.
          OUT="ios/Venn/Resources/GeneratedConfig.xcconfig"
          mkdir -p "$(dirname "$OUT")"
          {
            echo "// Auto-generated from .env in CI — do not commit."
            grep -E '^[A-Z_][A-Z0-9_]*=' .env | sed 's|//|/$()/|g'
          } > "$OUT"
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Prepare test simulator
        run: bash scripts/ci-select-simulator.sh
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Venn.xcodeproj \
            -scheme Venn \
            -destination "$TEST_DESTINATION" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/test-results.xcresult \
            -enableCodeCoverage YES \
            test | xcbeautify --is-ci
      # When snapshot tests fail, the suite (configured with
      # `record: .failed`) writes the freshly-rendered images into
      # __Snapshots__/ alongside the existing baselines. Upload that
      # directory so a maintainer can `gh run download <run-id> -n
      # snapshot-baselines-<sha>`, inspect the diffs, and commit the
      # CI-rendered baselines if the changes are intentional.
      # Cross-machine pixel drift is the rule, not the exception, for
      # gradient + blend-mode views — CI is the source of truth.
      - name: Upload snapshot baselines on test failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-baselines-${{ github.sha }}
          path: ios/VennTests/Snapshots/__Snapshots__/
          retention-days: 14
          if-no-files-found: ignore
      # Read the xccov report and fail the job if coverage drops below the
      # repo-wide threshold. The threshold is intentionally conservative
      # (we don't unit-test SwiftUI views) and can be ratcheted up as the
      # test surface grows. To avoid a brittle gate, only LINE coverage is
      # checked — function/branch coverage is too noisy at our size.
      - name: Coverage gate
        env:
          THRESHOLD: "40"
        run: |
          set -euo pipefail
          REPORT=$(xcrun xccov view --report --json build/test-results.xcresult)
          PERCENT=$(jq -r '.lineCoverage * 100 | floor' <<<"$REPORT")
          echo "Line coverage: ${PERCENT}%"
          jq -r '.targets[] | select(.name | endswith(".app")) | "\(.name): \((.lineCoverage * 100) | floor)%"' <<<"$REPORT"
          if [ "$PERCENT" -lt "$THRESHOLD" ]; then
            echo "::error::Line coverage ${PERCENT}% is below the ${THRESHOLD}% threshold."
            exit 1
          fi
      # Upload the simulator-built Venn.app so reviewers can drag it onto
      # a running iOS Simulator without rebuilding locally. Stopgap until
      # per-PR TestFlight builds land (blocked on the Apple Developer
      # account). The artifact is keyed on the commit SHA so multiple
      # PR runs don't clash.
      - name: Upload .app artifact
        uses: actions/upload-artifact@v7
        with:
          name: venn-${{ github.sha }}
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/Venn.app
          retention-days: 7
          if-no-files-found: error
