# Dependabot keeps dependencies up to date automatically by opening PRs when
# upgrades are available. Security updates open immediately; regular updates
# are batched weekly so we're not drowning in PRs.

version: 2
updates:
  # Swift Package Manager — app-level dependencies (Supabase, Sentry, PostHog, ...).
  # Tracked via the generated Package.resolved inside the Xcode project.
  - package-ecosystem: swift
    directory: /ios
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      observability:
        patterns: ["sentry-cocoa", "posthog-ios"]
      supabase:
        patterns: ["supabase-swift"]

  # Node tooling — only commitlint / husky / prettier live here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
