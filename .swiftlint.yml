# =============================================================================
# .swiftlint.yml — Swift linter configuration.
# =============================================================================
# SwiftLint enforces our Swift style. Pre-commit + CI run `swiftlint` over
# the whole `ios/` tree; warnings or errors fail the check.
#
# Rule docs: https://realm.github.io/SwiftLint/rule-directory.html
# =============================================================================

included:
  - ios/Venn
  - ios/VennTests
  - ios/VennUITests

excluded:
  - ios/Venn.xcodeproj
  - ios/Venn/Resources/GeneratedConfig.xcconfig
  - .build
  - DerivedData

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

disabled_rules:
  - todo

# Allow longer lines; we have plenty of horizontal screen space and forced
# wrapping hurts readability for chained SwiftUI modifiers.
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 80
  error: 200

type_body_length:
  warning: 300
  error: 500

# SwiftUI views legitimately have many small properties; avoid noise.
type_name:
  min_length: 2
  max_length:
    warning: 60
    error: 80

identifier_name:
  min_length: 1
  max_length:
    warning: 50
    error: 80
  excluded:
    - id
    - i
    - x
    - y
    - to

trailing_comma:
  # Require trailing commas in multi-line collection literals so SwiftLint
  # agrees with SwiftFormat's `--trailingcommas always`. The two tools used
  # to fight over multi-line array/dict literals — this aligns them.
  mandatory_comma: true

reporter: "xcode"
